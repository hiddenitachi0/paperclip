# DUR-3994 Stage 1 (inactive until Stage 3 adds it to the deploy settings):
# the server's keys come from ONE root-only file on the host instead of the
# container's settings.
#
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.prod.yml \
#     -f docker/docker-compose.secrets.yml up -d
#
# The file (default /root/paperclip-secrets/server.env, mode 0400, owned by
# root) holds NAME=value lines for the server's keys only, e.g.
#   BETTER_AUTH_SECRET=...
#   DATABASE_URL=...
#   PAPERCLIP_AGENT_JWT_SECRET=...
#   PAPERCLIP_SERVER_ANTHROPIC_API_KEY=...
# It is mounted at /run/secrets/paperclip_server, where only root can read
# it. The container's entrypoint reads it as root and hands the values to the
# server through a one-shot pipe (scripts/docker-entrypoint.sh), so they are
# neither in `docker inspect` nor in any process's environment. Names in the
# file that are not server keys are ignored.
#
# Each key is set to "" in the container settings so a value from docker/.env
# never reaches the container while this overlay is on. The entrypoint drops
# the empty names before starting the server.
services:
  server:
    secrets:
      - paperclip_server
    environment:
      BETTER_AUTH_SECRET: ""
      DATABASE_URL: ""
      DATABASE_BYPASS_URL: ""
      DATABASE_MIGRATION_URL: ""
      PAPERCLIP_AGENT_JWT_SECRET: ""
      PAPERCLIP_SECRETS_MASTER_KEY: ""
      PAPERCLIP_SERVER_ANTHROPIC_API_KEY: ""

secrets:
  paperclip_server:
    file: ${PAPERCLIP_SERVER_SECRETS_FILE:-/root/paperclip-secrets/server.env}
