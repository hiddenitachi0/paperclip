services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: paperclip
      POSTGRES_DB: paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    # Run Docker's small init (tini) as the container's PID 1, with the server
    # as its child. PID 1 is the process that must collect ("reap") every
    # process whose parent has gone away; Node does not do that. Every agent
    # run starts the Paperclip CLI, whose TypeScript loader (tsx) started an
    # `esbuild` helper (until DUR-3998 prebuilt the CLI into the image); when
    # the CLI exited the helper was handed to PID 1 and, with Node there,
    # stayed behind as a dead "zombie" entry forever. At about 19 per minute
    # the container hit its process limit after ~16 hours (`Cannot fork`,
    # every CLI call aborted, no agent could start). Kept for everything else
    # agent runs leave behind. Applies to every overlay layered on this file
    # (prod, secrets, CI tests).
    init: true
    ports:
      - "3100:3100"
    environment:
      DATABASE_URL: postgres://paperclip:paperclip@db:5432/paperclip
      PORT: "3100"
      SERVE_UI: "true"
      PAPERCLIP_DEPLOYMENT_MODE: "authenticated"
      PAPERCLIP_DEPLOYMENT_EXPOSURE: "private"
      PAPERCLIP_PUBLIC_URL: "${PAPERCLIP_PUBLIC_URL:-http://localhost:3100}"
      # DUR-3994: may also come from the secrets file instead (see
      # docker-compose.secrets.yml); the server refuses to start without it.
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-}"
    volumes:
      - paperclip-data:/paperclip
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  paperclip-data:
